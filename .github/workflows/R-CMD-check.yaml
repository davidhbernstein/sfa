# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: R-CMD-check

# A superseded run holds the Windows runner for nearly four hours. Cancel it
# when the same ref is pushed again; never cancel main, whose runs are the
# record of what was green when it merged.
#
# `cancel-in-progress` alone did NOT protect main. Measured 2026-09-30: six
# merges in eleven minutes, and the main run for every one of the first five was
# cancelled within a minute, before a single job started -- b4dcf7fe created
# 09:52:47, cancelled 09:53:33. Only the last survived, so five commits have no
# record of what they were green against. Rather than depend on how the
# expression is coerced, main gets a group of its OWN PER COMMIT: with one run
# per group there is nothing for a later push to cancel, whatever
# cancel-in-progress says. Pull requests keep sharing a group per ref, which is
# where the four-hour saving actually comes from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Pinned while CRAN publishes no macOS binaries for R 4.6:
          # bin/macosx/big-sur-arm64/contrib/ holds 4.2-4.5 only, so
          # 'release' (now 4.6.1) finds nothing prebuilt, tries to build
          # every dependency from source and dies in setup-r-dependencies.
          # Verified 2026-09-20: the 4.5 tree has all of them. Put this
          # back to 'release' once a 4.6 directory appears.
          - {os: macos-latest,   r: '4.5'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      # R CMD check caps parallelism at 2 cores unless told otherwise, which
      # would waste half of a 4-core runner now that the suite runs parallel.
      _R_CHECK_LIMIT_CORES_: false
      TESTTHAT_CPUS: 4

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
